# .github/dependabot.yml
# Dependabot configuration for mobilecombackup
#
# Features:
# - GitHub Actions ecosystem monitoring (weekly updates)
# - Security updates (handled automatically by Dependabot)
# - Auto-merge for patch updates when CI passes
#
# tc-5lxy.6 (OPERATOR RULING 2026-08-16, "yes, drop dependabot"): the gomod
# ecosystem entry is RETIRED. Dependabot bumped go.mod/go.sum but never
# regenerated gomod2nix.toml, so every dependabot Go PR broke `nix build`.
# Go dependency updates now flow through update-locks.sh's update-go-deps
# step, which bumps go.mod/go.sum AND regenerates gomod2nix.toml together in
# one commit. The github-actions ecosystem below is UNCHANGED/SURVIVES.

version: 2
updates:
  # GitHub Actions - Weekly updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "phillipgreenii"
    assignees:
      - "phillipgreenii"
    commit-message:
      prefix: "ci"
      include: "scope"
