name: "go: build versioned binaries"

on:
  push:
    tags:
      - "v*" # Trigger on tags starting with 'v' (v2.0.0 format)

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-release-binaries_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for version detection and git tag access
      - name: Install flox
        uses: flox/install-flox-action@v2.6.0
      - name: Go Release Binaries
        uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          overwrite: true
          pre_command: flox activate -- just ci && export CGO_ENABLED=0
          # Where to run `go build .`
          project_path: cmd/mobilecombackup
          binary_name: mobilecombackup
          asset_name: "${{ matrix.goos }}_${{ matrix.goarch }}"
          # Use `just build-cli` for version injection (will use git tag for release)
          build_command: cd ../.. && flox activate -- just build-cli && mv mobilecombackup cmd/mobilecombackup/
