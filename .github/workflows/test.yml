on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

name: run tests
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for version detection with git history
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.14.0
      - name: Extract version
        id: version
        run: |
          # scripts/build-version.sh is the single source of truth for the
          # version-string algorithm (devbox/CI path; no nix coupling).
          DEV_VERSION=$(bash scripts/build-version.sh)
          # For SonarQube, use base version only (clean semantic version).
          SONAR_VERSION=$(bash scripts/build-version.sh --base)
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "sonar_version=$SONAR_VERSION" >> $GITHUB_OUTPUT
      - name: Run formatter
        run: devbox run formatter
      - name: Run tests with coverage
        run: devbox run go test -v -covermode=set -coverprofile=coverage.out ./...
      - name: Run linter
        run: devbox run linter
      - name: Build CLI
        run: devbox run build-cli
      - name: SonarQube Scan
        # Skip for dependabot PRs (they don't have access to secrets)
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.sonar_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # gomod2nix.toml is the Nix build's dependency lockfile (it replaced the
  # hand-maintained vendorHash). It MUST be regenerated whenever go.mod/go.sum
  # change, and a stale one breaks `nix build`. Regeneration needs network, so it
  # cannot be a `nix flake check` derivation — this job is the drift gate instead.
  # Local equivalent: see docs/DEVELOPMENT.md "Nix packaging (gomod2nix)".
  gomod2nix-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Regenerate gomod2nix.toml
        run: nix run github:nix-community/gomod2nix -- generate
      - name: Fail if gomod2nix.toml is out of date
        run: |
          if ! git diff --exit-code -- gomod2nix.toml; then
            echo "::error file=gomod2nix.toml::gomod2nix.toml is out of date with go.mod/go.sum."
            echo "Regenerate it locally and commit the result:"
            echo "  nix run github:nix-community/gomod2nix -- generate"
            exit 1
          fi
