## Other Environment Options -----------------------------------------
# The previous manifest declared no explicit platform list either (that
# kind of environment is implicitly single-machine); left at flox's own default
# here rather than widened to flake.nix's 4-system list, since `go`
# itself has no x86_64-darwin build in flox's catalog today (`flox show
# go` lists only aarch64-darwin/aarch64-linux/x86_64-linux) --
# `flox install` failed resolution when this was tried empirically.
[options]
# Systems that environment is compatible with
# systems = [
#   "aarch64-darwin",
#   "aarch64-linux",
#   "x86_64-linux",
# ]
# Uncomment to disable CUDA detection.
# cuda-detection = false
