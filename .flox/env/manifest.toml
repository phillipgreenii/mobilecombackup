schema-version = "1.17.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------

# Translated 1:1 from the previous JSON package manifest's `packages` array
# (tc-5lxy.9), plus `just` (added by tc-5lxy.8). All 13 packages + just
# resolved directly from flox's own nixpkgs-backed catalog -- none needed
# nix-overlay/nvfetcher, verified empirically with `flox search` /
# `flox show` per-package before this manifest was authored.
#
# go.version = "1.26.5" matches quality-dashboard.yml's actions/setup-go
# pin exactly (both realigned together by tc-5lxy.17) -- the previous
# manifest's floating `go@1.26` had itself resolved to this same 1.26.5 in
# its lockfile, so this is not a behavior change.
#
# claude-code has NO exact `1.0.72` build in flox's catalog (confirmed via
# `flox show claude-code`: versions jump 1.0.69 -> 1.0.74, and that pin is
# from 2026-08 vs. today; flox's catalog does not carry every historical
# nixpkgs revision). Installed unpinned (floats to latest, currently
# 2.1.238) rather than left un-sourced -- an agent-CLI dev tool has no
# reproducibility requirement the way the Go toolchain does.
[install]
ast-grep.pkg-path = "ast-grep"
deno.pkg-path = "deno"
deno.version = "2"
fd.pkg-path = "fd"
go.pkg-path = "go"
go.version = "1.26.5"
gopls.pkg-path = "gopls"
golangci-lint.pkg-path = "golangci-lint"
gotestsum.pkg-path = "gotestsum"
jq.pkg-path = "jq"
just.pkg-path = "just"
ripgrep.pkg-path = "ripgrep"
uv.pkg-path = "uv"
viu.pkg-path = "viu"
yq.pkg-path = "yq"
# claude-code: see the [install] block comment above for why this floats
# unpinned instead of matching the previous manifest's claude-code@1.0.72.
claude-code.pkg-path = "claude-code"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
# Translated from the previous manifest's shell.init_hook (tc-5lxy.9). `export`s here
# are captured by flox and propagated into the activated environment; alias
# definitions are NOT (a plain `alias` in on-activate does not survive into
# the caller's interactive shell), so the Neovim aliases live in [profile]
# below instead -- see that section's comment.
[hook]
on-activate = '''
  go mod tidy
  echo '📋 Setting up development environment...'
  # Load project-specific Neovim config if it exists. FLOX_ENV_PROJECT is
  # flox's own project-root variable (see the template comment above) --
  # more robust than the previous tool's original $PWD, which only worked
  # when activating from the repo root.
  export NVIM_PROJECT_CONFIG="$FLOX_ENV_PROJECT/.config/nvim"
  if [ -d "$NVIM_PROJECT_CONFIG" ]; then
    export XDG_CONFIG_HOME_NVIM="$FLOX_ENV_PROJECT/.config"
    echo '🔧 Project-specific Neovim configuration loaded'
  fi
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
# Aliases from the previous manifest's init_hook. This section is sourced by the
# caller's actual interactive shell (unlike [hook], which runs once in a
# bash subshell), so aliases defined here DO persist -- this is the fix for
# the "aliases may not survive a non-interactive hook" risk noted on this
# bead. NVIM_PROJECT_CONFIG is exported by [hook] above, so it is already
# set by the time this runs.
[profile]
bash = '''
  if [ -d "$NVIM_PROJECT_CONFIG" ]; then
    alias vim="nvim -u $NVIM_PROJECT_CONFIG/init.lua"
    alias nvim="nvim -u $NVIM_PROJECT_CONFIG/init.lua"
  fi
'''
zsh = '''
  if [ -d "$NVIM_PROJECT_CONFIG" ]; then
    alias vim="nvim -u $NVIM_PROJECT_CONFIG/init.lua"
    alias nvim="nvim -u $NVIM_PROJECT_CONFIG/init.lua"
  fi
'''


